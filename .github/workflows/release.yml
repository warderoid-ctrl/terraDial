name: Release firmware

# Tag a commit and push the tag; everything an end user needs comes out the
# other side:
#
#   * terradial-ota.bin      -- the app image the panel flashes itself with
#                               (Settings > About > Check for updates)
#   * terradial-factory.bin  -- bootloader + partitions + app, flashed at 0x0
#                               by the web installer, and the only thing that
#                               works on a blank board
#
# Both are attached to the GitHub Release. The factory image is ALSO copied
# onto the Pages site next to the installer page, so the browser fetches it
# same-origin -- Web Serial installs fail silently on a cross-origin fetch
# the browser declines, and that is a miserable thing to debug from a bug
# report that just says "the button doesn't work".
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  pages: write    # publish the installer page
  id-token: write # required by actions/deploy-pages

env:
  PIO_ENV: crowpanel-1_28-rotary

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        # The tag minus its leading "v" is the version the firmware reports
        # and the updater compares against. tools/version.py picks it up from
        # TERRADIAL_VERSION below.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio esptool

      - name: Write a credential-free secrets.h
        # secrets.h is gitignored and the build won't compile without it.
        # A public build deliberately ships with NO network baked in: an
        # empty SSID means the panel comes up unconfigured and the user
        # picks their network on-device (Settings > Wi-Fi > scan), which is
        # the flow that has to work for a stranger's board anyway.
        run: |
          cat > include/secrets.h <<'EOF'
          #pragma once
          // Generated by CI for a public release build -- no credentials.
          // Wi-Fi is configured on-device via Settings > Wi-Fi.
          #define WIFI_SSID ""
          #define WIFI_PASS ""
          #define FLUIDNC_HOST "terrapen"
          #define TERRAPIXEL_HOST "terrapen-leds"
          EOF

      - name: Build firmware
        env:
          TERRADIAL_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e $PIO_ENV

      - name: Assemble release images
        run: |
          set -eu
          BUILD=".pio/build/$PIO_ENV"
          mkdir -p dist

          # The app image, exactly as it lands in app0/app1. This is what
          # the on-device updater downloads -- OTA_ASSET_NAME in
          # src/net/ota_updater.h has to keep matching this filename.
          cp "$BUILD/firmware.bin" dist/terradial-ota.bin

          # boot_app0.bin lives in the Arduino framework package, not the
          # build directory, and its path carries the package version.
          BOOT_APP0="$(find ~/.platformio/packages -name boot_app0.bin | head -n1)"
          test -n "$BOOT_APP0"

          # Offsets are ESP32-S3's, and the bootloader one is the trap: it
          # sits at 0x0 here, not the 0x1000 the original ESP32 uses.
          # "keep" leaves flash mode/frequency/size exactly as PlatformIO
          # built them into the bootloader header, so the merged image
          # boots identically to a `pio run -t upload`.
          esptool.py --chip esp32s3 merge_bin \
            -o dist/terradial-factory.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0     "$BUILD/bootloader.bin" \
            0x8000  "$BUILD/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"

          ls -l dist

      - name: Assemble the installer site
        run: |
          set -eu
          mkdir -p site
          cp web/index.html site/
          cp dist/terradial-factory.bin site/
          # The manifest is generated rather than committed so its version
          # can't drift from the binary sitting beside it.
          cat > site/manifest.json <<EOF
          {
            "name": "terraDial",
            "version": "${{ steps.version.outputs.version }}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [{ "path": "terradial-factory.bin", "offset": 0 }]
              }
            ]
          }
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: terraDial ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/terradial-ota.bin
            dist/terradial-factory.bin

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
