; PlatformIO Project Configuration File
;
; terraTouch -- CrowPanel 1.28" round touch+knob display, standalone
; control panel for a terraPen FluidNC pen plotter.
;
; Board is an ESP32-S3R8: 16MB flash, 8MB octal PSRAM. The generic
; esp32-s3-devkitc-1 board definition doesn't turn PSRAM/flash-size on by
; default, so those are set explicitly below to match the real hardware
; (confirmed against Elecrow's factory example project settings for this
; exact panel).

[env:crowpanel-1_28-rotary]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; WebSockets' frame reader spins until a partially-arrived frame
    ; completes, giving up only after this long. The 5s default meant one
    ; hiccup mid-frame wedged the network task for 5 seconds (and, before
    ; the networkTask split, the entire UI with it). 1500ms still tolerates
    ; a slow SD listing without turning a blip into a visible freeze.
    -DWEBSOCKETS_TCP_TIMEOUT=1500

lib_deps =
    lvgl/lvgl@^8.3.11
    lovyan03/LovyanGFX@^1.1.16
    adafruit/Adafruit NeoPixel@^1.12.0
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

monitor_speed = 115200
